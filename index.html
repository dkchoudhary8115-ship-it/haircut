var cv=document.getElementById('c'),ctx=cv.getContext('2d'),nm=document.getElementById('name');
var dpr=Math.min(window.devicePixelRatio||1,2),W=0,H=0,ox=0,oy=0,sc=1,IW=0,IH=0;
var P=[],reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
function rnd(a,b){return a+Math.random()*(b-a)}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function layout(){
  W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;
  var nameH=Math.min(H*.17,130)+H*.02,top=H*.03,aw=W*.96,ah=H-nameH-top;
  sc=Math.min(aw/IW,ah/IH);ox=(W-IW*sc)/2;oy=top+(ah-IH*sc)/2;
}
function load(s){return new Promise(function(r){var i=new Image();i.onload=function(){r(i)};i.src=s})}
function px(img){
  var c=document.createElement('canvas');c.width=img.width;c.height=img.height;
  var x=c.getContext('2d');x.drawImage(img,0,0);return x.getImageData(0,0,img.width,img.height).data;
}
function build(a,b){
  IW=a.width;IH=a.height;layout();
  var c=px(a),m=px(b);
  for(var j=0;j<IH;j++)for(var i=0;i<IW;i++){
    var k=(j*IW+i)*4;if(m[k]<128)continue;
    var mid=Math.random()<.3,side=Math.floor(Math.random()*4),mg=40,sx,sy;
    if(mid){sx=W/2+rnd(-W*.12,W*.12);sy=H*.45+rnd(-H*.12,H*.12)}
    else if(side==0){sx=rnd(-mg,W+mg);sy=-mg}else if(side==1){sx=W+mg;sy=rnd(-mg,H+mg)}
    else if(side==2){sx=rnd(-mg,W+mg);sy=H+mg}else{sx=-mg;sy=rnd(-mg,H+mg)}
    P.push({nx:i+.5+rnd(-.35,.35),ny:j+.5+rnd(-.35,.35),sx:sx,sy:sy,mid:mid,
      col:'rgb('+c[k]+','+c[k+1]+','+c[k+2]+')',
      d:Math.pow(Math.random(),.9)*11,u:mid?rnd(2.6,4):rnd(2.4,3.8),sw:rnd(-1,1)*(50+Math.random()*140),
      ph:Math.random()*6.283,sp:rnd(.5,1.2),z:rnd(.72,1.05)});
  }
}
var t0=0,shown=false;
function frame(now){
  if(!t0)t0=now;var T=(now-t0)/1000;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.globalAlpha=1;ctx.fillStyle='rgba(7,5,12,.55)';ctx.fillRect(0,0,W,H);
  var done=0,s=sc;
  for(var n=0;n<P.length;n++){
    var p=P[n],t=reduce?1:Math.min(Math.max((T-p.d)/p.u,0),1);
    if(t<=0)continue;
    var tx=ox+p.nx*s,ty=oy+p.ny*s,x,y,a,z=p.z*s;
    if(t>=1){done++;x=tx+Math.sin(T*p.sp+p.ph)*.35;y=ty+Math.cos(T*p.sp*.9+p.ph)*.35;a=1}
    else{
      var e=ease(t),dx=tx-p.sx,dy=ty-p.sy,l=Math.sqrt(dx*dx+dy*dy)||1,w=Math.sin(t*Math.PI)*p.sw;
      x=p.sx+dx*e-dy/l*w;y=p.sy+dy*e+dx/l*w;
      a=p.mid?Math.min(1,t*2.2):Math.min(1,.35+t*1.2);z*=.55+.45*e;
    }
    if(a!==1)ctx.globalAlpha=a;
    ctx.fillStyle=p.col;ctx.fillRect(x-z/2,y-z/2,z,z);
    if(a!==1)ctx.globalAlpha=1;
  }
  if(!shown&&done>P.length*.93){shown=true;nm.classList.add('on')}
  requestAnimationFrame(frame);
}
addEventListener('resize',function(){if(IW)layout()});
Promise.all([load(JPG),load(MSK)]).then(function(r){build(r[0],r[1]);ctx.fillStyle='#07050c';ctx.fillRect(0,0,W,H);requestAnimationFrame(frame)});
